services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: taskboard
      POSTGRES_USER: taskboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskboard -d taskboard"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    image: taskboard-api:local
    build:
      context: .
      dockerfile: src/TaskBoard.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Tasks: "Host=db;Database=taskboard;Username=taskboard;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: taskboard-web:local
    build:
      context: .
      dockerfile: src/TaskBoard.Web/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ApiBaseUrl: http://api:8080/
    ports:
      - "80:8080"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
